<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ИМТ — медицинские калькуляторы</title>

  <link rel="stylesheet" href="../../assets/css/base.css">
  <script src="../../assets/js/core.js"></script>
  <script src="../../assets/js/bridge.js"></script>

  <style>
    a.file-btn { text-decoration: none; }
  </style>
</head>
<body>

  <div class="top-stripe"></div>
  <div class="wrap">

    <header>
      <div>
        <h1>ИМТ</h1>
        <p class="subtitle">Общие калькуляторы</p>
      </div>
      <div class="header-controls">
        <a class="file-btn" href="../../index.html"><span>←</span> На главную</a>
      </div>
    </header>

    <div class="panel active" id="panel-bmi">
      <h2>Индекс массы тела</h2>
      <p class="desc">Вес / Рост²</p>

      <div class="panel-body">
        <div class="panel-fields-col">
          <div class="grid">
            <div class="field">
              <label>Вес (кг)</label>
              <input type="number" id="bmi-w" step="0.1" placeholder="Например, 70" data-min="20" data-max="300">
              <div class="field-error" id="bmi-w-error"></div>
            </div>
            <div class="field">
              <label>Рост (см)</label>
              <input type="number" id="bmi-h" step="0.5" placeholder="Например, 175" data-min="100" data-max="250">
              <div class="field-error" id="bmi-h-error"></div>
            </div>
          </div>
        </div>

        <div class="panel-result-col">
          <div class="result" id="bmi-result"><span class="empty-msg">Введите вес и рост</span></div>
          <div class="mini-scale" id="bmi-scale" style="display:none"></div>
        </div>
      </div>

      <details class="note">
        <summary>Норма и интерпретация</summary>
        <div class="note-content">
          <p>Норма 18.5–24.9 кг/м². Ожирение: I 30–34.9, II 35–39.9, III ≥40.</p>
        </div>
      </details>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {

      function renderBmiScale(value) {
        var el = document.getElementById('bmi-scale');
        if (!el) return;
        MedCore.renderMiniScale(el, value, 15, 45, [
          { until: 18.5, class: 'warn' },
          { until: 25, class: 'ok' },
          { until: 30, class: 'warn' },
          { until: 35, class: 'danger' },
          { until: 40, class: 'danger' },
          { until: 45, class: 'danger' }
        ], 'Ваш ИМТ: <strong>' + value.toFixed(1) + ' кг/м²</strong> · шкала 15–45');
      }

      function calcBMI() {
        var w = MedCore.num('bmi-w'), h = MedCore.num('bmi-h');
        var el = document.getElementById('bmi-result');

        if (!w || !h) {
          MedCore.showEmpty(el, 'Введите вес и рост');
          var s = document.getElementById('bmi-scale');
          if (s) s.style.display = 'none';
          return;
        }

        h = h / 100;
        var bmi = w / (h * h);

        var label, cls;
        if (bmi < 18.5) { label = 'Ниже нормы'; cls = 'warn'; }
        else if (bmi < 25) { label = 'Норма'; cls = 'ok'; }
        else if (bmi < 30) { label = 'Избыточный вес'; cls = 'warn'; }
        else if (bmi < 35) { label = 'Ожирение I'; cls = 'danger'; }
        else if (bmi < 40) { label = 'Ожирение II'; cls = 'danger'; }
        else { label = 'Ожирение III'; cls = 'danger'; }

        MedCore.render(el, bmi.toFixed(1), ' кг/м²', label, cls, 'Норма 18.5–24.9');
        renderBmiScale(bmi);
      }

      MedCore.bindCalc(['bmi-w', 'bmi-h'], calcBMI);

      calcBMI();
      MedCore.init();

    });
  </script>

</body>
</html>
